name: Android checks
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android-client
    steps:
      - uses: actions/checkout@v4
      - name: Scan tracked source for accidental secrets
        working-directory: .
        run: python3 tools/scan_secrets.py --all
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Unit tests, lint and APK
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --no-daemon
      - name: Python probe unit tests
        working-directory: .
        run: python3 -m unittest test_probe_account test_probe_extended
      - uses: actions/upload-artifact@v4
        with:
          name: Castflow-debug-apk
          path: android-client/app/build/outputs/apk/debug/app-debug.apk
